<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excursiones en Pipa – Matías De Cecilia</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1f3326;--g2:#2c4a37;--leaf:#7b9448;--b:#f2e9d6;--b2:#e8dcc1;--ink:#1c2a21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--b);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;line-height:1.55}
.hero{background:var(--g);color:var(--b);padding:44px 22px 72px;text-align:center;border-radius:0 0 50% 50%/0 0 36px 36px}
.photo{width:148px;height:148px;border-radius:50%;border:5px solid var(--b);object-fit:cover;box-shadow:0 0 0 4px var(--leaf);margin:0 auto 22px;display:block}
h1{font-weight:800;font-size:clamp(26px,7.5vw,40px);letter-spacing:.04em;margin:0;line-height:1.1}
.role{font-weight:600;letter-spacing:.32em;font-size:13px;margin:10px 0 26px;color:var(--leaf)}
.prov{display:inline-flex;align-items:center;gap:12px;background:rgba(242,233,214,.1);border:1px solid rgba(242,233,214,.25);border-radius:40px;padding:8px 20px 8px 8px;font-size:13px;text-align:left}
.prov img{width:46px;height:46px;border-radius:50%}
.prov b{display:block;font-size:15px}
.intro{max-width:560px;margin:22px auto 0;font-size:15px;opacity:.9}
main{max-width:760px;margin:-34px auto 0;padding:0 16px 110px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 18px}
.chip{flex:none;font:600 14px Montserrat,sans-serif;padding:10px 18px;border-radius:30px;border:2px solid var(--g);background:var(--b);color:var(--g);cursor:pointer}
.chip[aria-pressed=true]{background:var(--g);color:var(--b)}
.chip:focus-visible,.head:focus-visible,.wa:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.card{background:#fbf6ea;border-radius:22px;margin-bottom:16px;overflow:hidden;border:1px solid var(--b2);box-shadow:0 6px 18px rgba(31,51,38,.12)}
.card[hidden]{display:none}
.head{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:18px;font:inherit;color:inherit;cursor:pointer}
.ico{width:54px;height:54px;border-radius:16px;background:var(--g);display:grid;place-items:center;font-size:28px}
.head h2{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.head small{display:block;font-weight:500;color:#4d5f52;margin-top:3px}
.price{font-weight:800;font-size:17px;color:var(--g);text-align:right;line-height:1.2}
.price small{font-weight:500;font-size:11px;color:#4d5f52}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.card.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.in{padding:0 18px 20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 16px}
.facts div{background:var(--b);border-radius:14px;padding:10px 12px;font-size:13px}
.facts b{display:block;font-size:11px;color:var(--leaf);font-weight:600}
.in p{margin:0 0 12px;font-size:14.5px}
.in h3{font-size:14px;margin:16px 0 8px}
.route{list-style:none;margin:0 0 14px;padding:0 0 0 18px;border-left:3px solid var(--leaf)}
.route li{font-size:14px;padding:3px 0 3px 8px}
.note{background:var(--g);color:var(--b);border-radius:14px;padding:12px 14px;font-size:13px;margin:0 0 14px}
.wa{display:block;text-align:center;background:var(--g);color:var(--b);text-decoration:none;font-weight:600;padding:14px;border-radius:30px}
.fix{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:728px;margin:auto;box-shadow:0 8px 24px rgba(0,0,0,.3);background:var(--leaf);color:var(--g);z-index:5}
footer{text-align:center;font-size:12px;color:#4d5f52;padding:0 20px 120px}
.hero{position:relative}.lang{position:absolute;top:14px;right:14px;display:flex;border:1.5px solid rgba(242,233,214,.5);border-radius:30px;overflow:hidden}.lang button{font:600 12px Montserrat,sans-serif;padding:7px 13px;background:none;color:var(--b);border:0;cursor:pointer}.lang button[aria-pressed=true]{background:var(--b);color:var(--g)}.lang button:focus-visible{outline:3px solid var(--leaf);outline-offset:-3px}
@media (prefers-reduced-motion:reduce){.body{transition:none}html{scroll-behavior:auto}}
</style>
</head>
